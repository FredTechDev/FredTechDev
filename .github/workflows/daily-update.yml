
name: Daily Engineering Transmission

on:
  schedule:
    # Midnight in Kenya (UTC+3)
    - cron: "0 21 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily transmission
        run: python scripts/daily_update.py

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "README already up to date."
          else
            git add README.md
            git commit -m "chore: update daily engineering transmission"
            git push
          fi

